spring:
  application:
    name: glicemia-backend
  profiles:
    active: dev

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://localhost:3306/glicemia_db?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
    username: root
    password: REMOVED_PASSWORDDts@
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm
    time-zone: America/Sao_Paulo

app:
  jwt:
    secret: d3v3l0pm3ntS3cr3tK3yF0rGlic3m1aS1st3m4Jwt2024Dev
    expiration: 86400000  # 24 horas em ms
  excel:
    path: ./dados.xlsx
  cors:
    allowed-origins: http://localhost:3000,http://127.0.0.1:5500

logging:
  level:
    com.glicemia: DEBUG
    org.springframework.security: INFO

server:
  port: 8080

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm
    time-zone: America/Sao_Paulo

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000
  excel:
    path: ${EXCEL_PATH:./dados.xlsx}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://seu-usuario.github.io}

logging:
  level:
    com.glicemia: INFO

server:
  port: ${PORT:8080}
