version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: glicemia-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: glicemia_db
      MYSQL_USER: glicemia
      MYSQL_PASSWORD: REMOVED_PASSWORD
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  glicemia-app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: glicemia-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:mysql://mysql-db:3306/glicemia_db?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
      DATABASE_USERNAME: glicemia
      DATABASE_PASSWORD: REMOVED_PASSWORD
      JWT_SECRET: REMOVED_SECRET
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:5500
      EXCEL_PATH: /app/data/dados.xlsx
    volumes:
      - excel_data:/app/data
    depends_on:
      mysql-db:
        condition: service_healthy

volumes:
  mysql_data:
  excel_data:
