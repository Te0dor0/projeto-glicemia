<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Glicemia • Sistema Estrelado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="login-page">

  <!-- Estrelas animadas -->
  <div class="stars" id="stars"></div>
  <div class="nebula"></div>

  <main class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <div class="moon-icon">☽</div>
        <h1>Glicemia</h1>
        <p class="login-subtitle">Sistema de Controle Glicêmico</p>
      </div>

      <form class="login-form" id="loginForm">
        <div class="form-group">
          <label for="username">Usuário</label>
          <input type="text" id="username" placeholder="Teo ou Lui" autocomplete="username" required/>
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <div class="input-eye">
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required/>
            <button type="button" class="eye-btn" onclick="togglePassword()">👁</button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
          <span>Entrar no Sistema</span>
          <span class="btn-star">✦</span>
        </button>

        <div class="login-error" id="loginError"></div>
      </form>

      <div class="login-footer">
        <span class="star-deco">✦ ✦ ✦</span>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
    // Gerar estrelas animadas
    const starsEl = document.getElementById('stars');
    for (let i = 0; i < 200; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.cssText = `
        left:${Math.random()*100}%;
        top:${Math.random()*100}%;
        width:${Math.random()*3+1}px;
        height:${Math.random()*3+1}px;
        animation-delay:${Math.random()*4}s;
        animation-duration:${Math.random()*3+2}s;
      `;
      starsEl.appendChild(star);
    }

    // Redirecionar se já autenticado
    if (API.getToken()) {
      window.location.href = 'pages/dashboard.html';
    }

    function togglePassword() {
      const inp = document.getElementById('password');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errEl = document.getElementById('loginError');
      btn.disabled = true;
      btn.querySelector('span').textContent = 'Autenticando...';
      errEl.textContent = '';

      try {
        const data = await API.login(
          document.getElementById('username').value,
          document.getElementById('password').value
        );
        localStorage.setItem('token', data.token);
        localStorage.setItem('role', data.role);
        localStorage.setItem('username', data.username);
        window.location.href = 'pages/dashboard.html';
      } catch (err) {
        console.error('Login error:', err);
        if (err.message.includes('401')) {
          errEl.textContent = '✦ Usuário ou senha incorretos.';
        } else if (err.message.includes('403')) {
          errEl.textContent = '✦ Acesso negado pelo servidor (403).';
        } else {
          errEl.textContent = '✦ Erro de conexão com o servidor.';
        }
        btn.disabled = false;
        btn.querySelector('span').textContent = 'Entrar no Sistema';
      }
    });
  </script>
</body>
</html>
