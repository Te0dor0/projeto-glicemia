<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Glicemia • Sistema Estrelado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="nebula"></div>
  <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: white; font-family: 'Cinzel', serif;">
    <h1 style="font-size: 3rem; margin-bottom: 1rem;">Glicemia</h1>
    <p style="font-size: 1.2rem; opacity: 0.8;">✦ Entrando no Sistema...</p>
  </div>

  <script>
    // Gerar estrelas animadas
    const starsEl = document.getElementById('stars');
    for (let i = 0; i < 200; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.cssText = `left:${Math.random()*100}%; top:${Math.random()*100}%; width:${Math.random()*3+1}px; height:${Math.random()*3+1}px; animation-delay:${Math.random()*4}s; animation-duration:${Math.random()*3+2}s;`;
      starsEl.appendChild(star);
    }
    
    // Redirecionamento automático
    setTimeout(() => {
      window.location.href = 'pages/dashboard.html';
    }, 1000);
  </script>
</body>
</html>
